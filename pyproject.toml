[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shotguncv"
version = "0.3.1"
description = "Pipeline-first AI Resume Ops system for sea-application workflows."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ShotgunCV Contributors" }]
dependencies = ["pypdf>=5.0", "PyMuPDF>=1.24", "Pillow>=10.0", "pytesseract>=0.3.10", "langgraph>=1.2,<2.0"]

[project.optional-dependencies]
rag = [
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
]

[project.scripts]
shotguncv = "shotguncv_cli.main:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.package-data]
"shotguncv_core.db" = ["alembic.ini", "migrations/README.md", "migrations/script.py.mako"]

[tool.setuptools.packages.find]
where = [
    "packages/py-core/src",
    "packages/py-agents/src",
    "packages/py-evals/src",
    "apps/cli/src",
]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
